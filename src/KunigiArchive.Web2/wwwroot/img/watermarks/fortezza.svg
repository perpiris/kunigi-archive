<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 14 140 84" fill="none" stroke="#fff" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
  <!-- The Fortezza from the air, as seen from the sea: arrowhead bastions joined by curtain walls
       along the crest, the Sultan Ibrahim mosque's dome inside, the town behind, the road and the
       rocky shore around the headland, and the harbour mole with the lighthouse in the distance. -->

  <!-- Harbour, lighthouse and town behind -->
  <path d="M4 28 H30" stroke-width=".9" stroke-opacity=".7"/>
  <path d="M30 28 V21 M29 21 H31" stroke-width=".9" stroke-opacity=".7"/>
