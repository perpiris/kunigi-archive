  <!-- The plateau's sides rising to the town -->
  <path d="M8 52 Q10 44 18 38 M132 52 Q130 44 122 37" stroke-width=".9" stroke-opacity=".7"/>

  <!-- The mosque and the other buildings inside -->
  <path d="M59 39 V46 H73 V39"/>
  <path d="M58 39 Q66 25.5 74 39 Z" fill="#fff" fill-opacity=".3"/>
  <path d="M66 32 V29.5"/>
