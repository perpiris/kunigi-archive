# Images are pinned to release tags (#39): upgrade on purpose by changing the tag here, backup first for db.
# Every container's `docker logs` output rotates (#40): 5 files of 10 MB each.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # 1. Reverse Proxy (Nginx)
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.11.6-alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - conf:/etc/nginx/conf.d
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - certs:/etc/nginx/certs:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./nginx-limits.conf:/etc/nginx/conf.d/nginx-limits.conf:ro
    logging: *logging
    restart: always

  # 2. Automated SSL Certificates (Let's Encrypt Certbot)
  acme-companion:
    image: nginxproxy/acme-companion:2.8.2
    container_name: nginx-acme-companion
    environment:
      - DEFAULT_EMAIL=hello@tokinigi.gr
      - NGINX_PROXY_CONTAINER=nginx-proxy
    volumes:
      - certs:/etc/nginx/certs:rw
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
      - conf:/etc/nginx/conf.d
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - nginx-proxy
    logging: *logging
    restart: always

  # 3. Database (SQL Server)
  db:
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
    container_name: kunigi_db
    # MSSQL_SA_PASSWORD only applies when the volume is first created;
    # sa itself is disabled (#46); ops/vps/init-secrets.sh --rotate-sa still changes its password.
    env_file:
      - /opt/kunigi/db.env
    # Docker bypasses ufw; the DOCKER-USER rules from ops/vps/setup.sh limit this to the WireGuard VPN.
    ports:
      - "1433:1433"
    volumes:
      - db_data:/var/opt/mssql
    logging: *logging
    restart: always

  # 4. The site (src/KunigiArchive.Web). Its settings and secrets (connection string, SMTP password, first admin,
  # email link base URL) are in /opt/kunigi/web.env; the image listens on 8080.
  # The image is built by the deploy workflow and pulled from GHCR (#39); the deploy tags the commit's image :latest
  # here. Roll back by tagging an older one :latest (ops/vps/README.md, "Rollback").
  web:
    image: ghcr.io/perpiris/kunigi-archive-web:latest
    pull_policy: never
    container_name: kunigi_web
    env_file:
      - /opt/kunigi/web.env
    environment:
      # Nginx Proxy settings
      - VIRTUAL_HOST=tokinigi.gr,www.tokinigi.gr
      - LETSENCRYPT_HOST=tokinigi.gr,www.tokinigi.gr
      - VIRTUAL_PORT=8080
      # App settings
      - DataProtection__KeysPath=/app/keys
      - LogFile__Path=/app/logs/web-.log
      # Traces, metrics and logs to the collector below, over the Docker network only.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    volumes:
      # Uploads, sign-in keys and log files. The container runs as uid 1654 (APP_UID), so the folders must be
      # writable by it (ops/vps/init-secrets.sh creates them). All three are in the nightly backup but the logs.
      - ../kunigi_web_media:/app/media
      - ../kunigi_web_keys:/app/keys
      - ../kunigi_web_logs:/app/logs
    # `docker logs` output rotates too; the files in kunigi_web_logs keep 30 days.
    logging: *logging
    depends_on:
      - db
    restart: always

  # 5-7. Telemetry (owner only). The site sends traces, metrics and logs (OpenTelemetry) to the collector, which
  # copies them to the Aspire Dashboard (live, in memory) and OpenObserve (30 days on disk). Only the two UIs are
  # published, and the firewall lets them through over the WireGuard VPN only, like 1433 (ops/vps/setup.sh):
  # http://10.8.0.1:18888 (dashboard) and http://10.8.0.1:5080 (OpenObserve). No VIRTUAL_HOST on any of them, so
  # nginx-proxy never serves them. Nothing here is backed up: losing it loses only telemetry.
  otel-collector:
    image: otel/opentelemetry-collector:0.166.0
    container_name: kunigi_otel_collector
    command: ["--config=/etc/otelcol/config.yaml"]
    env_file:
      - path: /opt/kunigi/openobserve.env   # OPENOBSERVE_AUTH
        required: false
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    mem_limit: 256m
    logging: *logging
    restart: always

  # Live view, kept in memory only (a restart clears it); asks for the token in /opt/kunigi/dashboard.env.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.5
    container_name: kunigi_dashboard
    env_file:
      # Dashboard__Frontend__BrowserToken. Without the file the dashboard makes up a token at each start and
      # prints the login link in `docker logs kunigi_dashboard`.
      - path: /opt/kunigi/dashboard.env
        required: false
    environment:
      - Dashboard__Frontend__AuthMode=BrowserToken
      - Dashboard__Otlp__AuthMode=Unsecured
    ports:
      - "18888:18888"
    mem_limit: 512m
    logging: *logging
    restart: always

  # History: logs, traces and metrics kept 30 days in the openobserve_data volume. Sign in with
  # ZO_ROOT_USER_EMAIL / ZO_ROOT_USER_PASSWORD from /opt/kunigi/openobserve.env (used on the first start only).
  openobserve:
    image: openobserve/openobserve:v1.1.2
    container_name: kunigi_openobserve
    env_file:
      - path: /opt/kunigi/openobserve.env
        required: false
    environment:
      - ZO_DATA_DIR=/data
      - ZO_COMPACT_DATA_RETENTION_DAYS=30
      # Its in-memory table defaults to half the host's memory; keep it well inside mem_limit.
      - ZO_MEM_TABLE_MAX_SIZE=256
      - ZO_TELEMETRY=false
    ports:
      - "5080:5080"
    volumes:
      - openobserve_data:/data
    mem_limit: 1g
    logging: *logging
    restart: always

volumes:
  db_data:
  openobserve_data:
  conf:
  vhost:
  html:
  certs:
  acme:
