services:
  # 1. Reverse Proxy (Nginx)
  nginx-proxy:
    image: nginxproxy/nginx-proxy:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - conf:/etc/nginx/conf.d
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - certs:/etc/nginx/certs:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./nginx-limits.conf:/etc/nginx/conf.d/nginx-limits.conf:ro
    restart: always

  # 2. Automated SSL Certificates (Let's Encrypt Certbot)
  acme-companion:
    image: nginxproxy/acme-companion
    container_name: nginx-acme-companion
    environment:
      - DEFAULT_EMAIL=hello@tokinigi.gr
      - NGINX_PROXY_CONTAINER=nginx-proxy
    volumes:
      - certs:/etc/nginx/certs:rw
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
      - conf:/etc/nginx/conf.d
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - nginx-proxy
    restart: always

  # 3. Database (SQL Server)
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: kunigi_db
    # MSSQL_SA_PASSWORD only applies when the volume is first created;
    # change it on an existing database with ops/vps/init-secrets.sh --rotate-sa.
    env_file:
      - /opt/kunigi/db.env
    # Docker bypasses ufw; the DOCKER-USER rules from ops/vps/setup.sh limit this to the WireGuard VPN.
    ports:
      - "1433:1433"
    volumes:
      - db_data:/var/opt/mssql
    restart: always

  # 4. Web Application (.NET)
  web:
    build:
      context: .
      dockerfile: src/KunigiArchive.Web/Dockerfile
    container_name: kunigi_web
    env_file:
      - /opt/kunigi/app.env
    environment:
      # Nginx Proxy settings
      - VIRTUAL_HOST=tokinigi.gr,www.tokinigi.gr
      - LETSENCRYPT_HOST=tokinigi.gr,www.tokinigi.gr
      - VIRTUAL_PORT=8080
      # App settings
      - ASPNETCORE_URLS=http://+:8080
      - MediaDirectory=/app/media
    volumes:
      - ../kunigi_media:/app/media
    depends_on:
      - db
    restart: always

volumes:
  db_data:
  conf:
  vhost:
  html:
  certs:
  acme:
