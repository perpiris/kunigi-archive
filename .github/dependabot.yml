version: 2
updates:
  - package-ecosystem: nuget
    directory: /KunigiArchive.Web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns: ["Microsoft.*"]
      serilog:
        patterns: ["Serilog*"]
    ignore:
      # Stay on .NET 10 LTS (#16): no 11.x packages
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      # ImageSharp 4.x requires a paid license key
      - dependency-name: "SixLabors.ImageSharp"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on .NET 10 LTS base images
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
