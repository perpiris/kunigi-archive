name: Deploy beta (beta.tokinigi.gr)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Own folder on the VPS, separate from the live site's ~/kunigi-archive. The folder is replaced as a whole
      # (unpacked next to it, then swapped), so files deleted from the repo don't linger on the server (#45).
      # Nothing server-only lives in it: secrets are in /opt/kunigi, data in sibling folders.
      - name: Copy files via SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          TARGET: kunigi-beta
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          tar --exclude=./.git --exclude=./.github --exclude=./.idea -czf - . \
            | ssh -i ~/.ssh/vps_key ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "set -e
                cd ~ && rm -rf $TARGET.new $TARGET.old && mkdir $TARGET.new
                tar -xzf - -C $TARGET.new
                if [ -d $TARGET ]; then mv $TARGET $TARGET.old; fi
                mv $TARGET.new $TARGET
                rm -rf $TARGET.old"
          rm -f ~/.ssh/vps_key

      - name: Rebuild and restart the beta container
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/kunigi-beta
            docker compose -f docker-compose.beta.yml up -d --build

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://beta.tokinigi.gr/ || true)
            if [ "$code" = "200" ]; then
              echo "Beta is up (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: HTTP $code, retrying in 10s..."
            sleep 10
          done
          echo "::error::Beta did not return HTTP 200 within 5 minutes after deploy"
          exit 1
