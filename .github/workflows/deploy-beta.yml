name: Deploy beta (beta.tokinigi.gr)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Own folder on the VPS, separate from the live site's ~/kunigi-archive.
      - name: Copy files via SSH
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "~/kunigi-beta"
          exclude: ".git,.github,.idea,bin,obj"

      - name: Rebuild and restart the beta container
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/kunigi-beta
            docker compose -f docker-compose.beta.yml up -d --build

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://beta.tokinigi.gr/ || true)
            if [ "$code" = "200" ]; then
              echo "Beta is up (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: HTTP $code, retrying in 10s..."
            sleep 10
          done
          echo "::error::Beta did not return HTTP 200 within 5 minutes after deploy"
          exit 1
