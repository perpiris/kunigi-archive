name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore KunigiArchive.slnx

      # Warnings fail the build, except:
      # - NU1901-NU1904: vulnerable-package warnings (package updates are done locally, #15)
      # - CA1416: platform check on PDFtoImage call in DirectoryService (tracked in #28)
      - name: Build
        run: >
          dotnet build KunigiArchive.slnx -c Release --no-restore
          -warnaserror -warnnotaserror:NU1901,NU1902,NU1903,NU1904,CA1416

      - name: Test
        run: dotnet test KunigiArchive.slnx -c Release --no-build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
