name: Deploy web (tokinigi.gr)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The folder is replaced as a whole (unpacked next to it, then swapped), so files deleted from the repo don't
      # linger on the server (#45). Nothing server-only lives in it: secrets are in /opt/kunigi, data in sibling
      # folders. Its name stays kunigi-archive: it's the compose project name, and with it the volume names.
      - name: Copy files via SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          TARGET: kunigi-archive
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          tar --exclude=./.git --exclude=./.github --exclude=./.idea -czf - . \
            | ssh -i ~/.ssh/vps_key ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "set -e
                cd ~ && rm -rf $TARGET.new $TARGET.old && mkdir $TARGET.new
                tar -xzf - -C $TARGET.new
                if [ -d $TARGET ]; then mv $TARGET $TARGET.old; fi
                mv $TARGET.new $TARGET
                rm -rf $TARGET.old"
          rm -f ~/.ssh/vps_key

      - name: Rebuild and restart containers
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/kunigi-archive
            # --pull: the build takes the newest .NET 10.0.x base image, so runtime patches arrive with deploys (#39).
            docker compose build --pull web
            docker compose up -d

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            # /healthz answers 200 only when the site can reach its database (#39).
            code=$(curl -s -o /dev/null -w '%{http_code}' https://tokinigi.gr/healthz || true)
            if [ "$code" = "200" ]; then
              echo "Site and database are up (/healthz 200)"
              exit 0
            fi
            echo "Attempt $i: HTTP $code, retrying in 10s..."
            sleep 10
          done
          echo "::error::/healthz did not return 200 within 5 minutes after deploy"
          exit 1
