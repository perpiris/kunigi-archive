name: Deploy web (tokinigi.gr)

# Builds the site's image here and pushes it to GHCR, tagged with the commit SHA; the server only pulls it (#39).
# The server keeps the last few images, so a rollback is a one-line switch (ops/vps/README.md, "Rollback").

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/perpiris/kunigi-archive-web

jobs:
  image:
    name: Build and push image
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # pull: the newest .NET 10.0.x base image, so runtime patches arrive with deploys.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/KunigiArchive.Web/Dockerfile
          push: true
          pull: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The folder (compose file, nginx limits, ops scripts) is replaced as a whole (unpacked next to it, then
      # swapped), so files deleted from the repo don't linger on the server (#45). Nothing server-only lives in it:
      # secrets are in /opt/kunigi, data in sibling folders. Its name stays kunigi-archive: it's the compose project
      # name, and with it the volume names.
      - name: Copy files via SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          TARGET: kunigi-archive
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          tar --exclude=./.git --exclude=./.github --exclude=./.idea -czf - . \
            | ssh -i ~/.ssh/vps_key ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "set -e
                cd ~ && rm -rf $TARGET.new $TARGET.old && mkdir $TARGET.new
                tar -xzf - -C $TARGET.new
                if [ -d $TARGET ]; then mv $TARGET $TARGET.old; fi
                mv $TARGET.new $TARGET
                rm -rf $TARGET.old"
          rm -f ~/.ssh/vps_key

      # Pulls this commit's image and tags it :latest on the server, which is what docker-compose.yml runs, so a
      # plain `docker compose up -d` there keeps running the deployed image. The token only lives for this job; the
      # server logs out again. Older images beyond the newest KEEP are removed (the running one never is).
      - name: Pull image and restart
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.IMAGE }}
          TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE,TAG
          script: |
            set -e
            cd ~/kunigi-archive
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE:$TAG" || { docker logout ghcr.io; exit 1; }
            docker logout ghcr.io
            docker tag "$IMAGE:$TAG" "$IMAGE:latest"
            docker compose up -d
            KEEP=4
            docker images "$IMAGE" --format '{{.Tag}}' | grep -vx latest | tail -n +$((KEEP + 1)) \
              | while read -r old; do docker rmi "$IMAGE:$old" || true; done
            echo "Images kept for rollback:"
            docker images "$IMAGE" --format '{{.Tag}}  {{.CreatedSince}}'

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            # /healthz answers 200 only when the site can reach its database (#39).
            code=$(curl -s -o /dev/null -w '%{http_code}' https://tokinigi.gr/healthz || true)
            if [ "$code" = "200" ]; then
              echo "Site and database are up (/healthz 200)"
              exit 0
            fi
            echo "Attempt $i: HTTP $code, retrying in 10s..."
            sleep 10
          done
          echo "::error::/healthz did not return 200 within 5 minutes after deploy"
          exit 1
