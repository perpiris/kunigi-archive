name: Off-site backup

# Manual only: Actions → "Off-site backup" → Run workflow.
#
# Copies the newest nightly backup from the VPS (/opt/kunigi-backups, created by
# vps-backup.sh at 02:00), checks that it contains the database and media,
# encrypts it, stores it as a workflow artifact, and only then deletes the
# previous backup artifacts, so exactly one off-site copy is kept.
#
# Required secrets: VPS_HOST, VPS_USERNAME, VPS_SSH_KEY, BACKUP_PASSPHRASE.
# Keep BACKUP_PASSPHRASE in a password manager too: without it the backup
# cannot be decrypted.
#
# Restore: download the artifact, then
#   gpg --decrypt kunigi_backup_<date>.tar.gz.gpg > kunigi_backup_<date>.tar.gz
#   tar -xzf kunigi_backup_<date>.tar.gz   # → backup_<ts>/databases/*.bak, media_v2/, keys_v2/, ... (ops/vps/README.md)
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write # needed to delete previous backup artifacts

concurrency:
  group: offsite-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE secret is not set"
            exit 1
          fi

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Download latest backup from VPS
        run: |
          SSH_CMD="ssh -i ~/.ssh/vps_key ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}"

          LATEST=$($SSH_CMD "ls -t /opt/kunigi-backups/kunigi_backup_*.tar.gz 2>/dev/null | head -1")
          if [ -z "$LATEST" ]; then
            echo "::error::No backup found on VPS"
            exit 1
          fi
          echo "Latest backup on VPS: $LATEST"

          NAME=$(basename "$LATEST")
          scp -i ~/.ssh/vps_key "${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:$LATEST" "./$NAME"
          echo "BACKUP_FILE=$NAME" >> "$GITHUB_ENV"
          ls -lh "$NAME"

      - name: Verify backup contents
        run: |
          tar -tzvf "$BACKUP_FILE" > listing.txt

          # Web2 is the live site (#85): its database and uploads must be there.
          DB_SIZE=$(awk '$NF ~ /\/databases\/KunigiArchiveV2\.bak$/ {print $3}' listing.txt | head -1)
          MEDIA_FILES=$(awk '$1 !~ /^d/ && $NF ~ /\/media_v2\// {n++} END {print n+0}' listing.txt)

          echo "KunigiArchiveV2.bak size: ${DB_SIZE:-missing}"
          echo "media_v2 files: $MEDIA_FILES"

          if [ -z "$DB_SIZE" ] || [ "$DB_SIZE" -lt 1048576 ]; then
            echo "::error::databases/KunigiArchiveV2.bak is missing or smaller than 1 MB, refusing to replace the previous off-site backup"
            exit 1
          fi
          if [ "$MEDIA_FILES" -lt 1 ]; then
            echo "::error::No Web2 media files in backup, refusing to replace the previous off-site backup"
            exit 1
          fi

          {
            echo "## Backup"
            echo "- File: \`$BACKUP_FILE\` ($(du -h "$BACKUP_FILE" | cut -f1))"
            echo "- KunigiArchiveV2.bak: $DB_SIZE bytes"
            echo "- media_v2 files: $MEDIA_FILES"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt backup
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "$BACKUP_FILE.gpg" "$BACKUP_FILE"
          rm -f "$BACKUP_FILE"
          ls -lh "$BACKUP_FILE.gpg"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v7
        with:
          name: kunigi-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}.gpg
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

      - name: Delete previous backup artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("kunigi-backup")) | select(.workflow_run.id != ${{ github.run_id }}) | .id' \
            > old_artifacts.txt
          echo "Deleting $(wc -l < old_artifacts.txt) previous backup artifact(s)"
          while read -r id; do
            [ -n "$id" ] && gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done < old_artifacts.txt

      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/vps_key kunigi_backup_*
