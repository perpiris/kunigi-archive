# Own compose project (kunigi-beta), so beta deploys never touch the live stack.
# Host folders and /opt/kunigi/beta.env come from ops/vps/init-secrets.sh --beta.
name: kunigi-beta

services:
  beta:
    build:
      context: .
      dockerfile: src/KunigiArchive.Web2/Dockerfile
    container_name: kunigi_beta
    env_file:
      - path: /opt/kunigi/beta.env
        required: false
    environment:
      - VIRTUAL_HOST=beta.tokinigi.gr
      - LETSENCRYPT_HOST=beta.tokinigi.gr
      - VIRTUAL_PORT=8080
      - ASPNETCORE_URLS=http://+:8080
      - DataProtection__KeysPath=/app/keys
      - LogFile__Path=/app/logs/web2-.log
      - Robots__NoIndex=true
    volumes:
      # Beta's own uploads, sign-in keys and log files, never the live site's. The container runs as uid 1654
      # (APP_UID), so the folders must be writable by it (ops/vps/init-secrets.sh --beta creates them).
      - ../kunigi_beta_media:/app/media
      - ../kunigi_beta_keys:/app/keys
      - ../kunigi_beta_logs:/app/logs
    # `docker logs` output rotates too (#40); the files in kunigi_beta_logs keep 30 days.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: always

# The live stack's network: reach nginx-proxy (routing/TLS) and the db service.
networks:
  default:
    name: kunigi-archive_default
    external: true
